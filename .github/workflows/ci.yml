name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    name: zsh -n (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Check every source file parses
        run: |
          fail=0
          for f in src/* zsh-insulter.plugin.zsh; do
            if ! zsh -n "$f"; then
              echo "::error file=$f::Syntax error"
              fail=1
            fi
          done
          exit $fail

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './src'
          shell: bash

  zizmor:
    name: Zizmor (Actions injection/security scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install zizmor
        run: pip install --break-system-packages --quiet zizmor
      - name: Scan workflows for injection and other security issues
        run: zizmor --config .github/zizmor.yml .github/workflows
